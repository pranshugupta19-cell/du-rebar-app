<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1D9E75">
<title>DU Rebar — Chemical Log</title>
<style>
  :root {
    --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #085041;
    --warn-bg: #FAEEDA; --warn-fg: #854F0B;
    --bad-bg: #FCEBEB; --bad-fg: #A32D2D;
    --ok-bg: #EAF3DE; --ok-fg: #3B6D11;
    --bg: #F5F5F5; --surface: #FFFFFF;
    --border: #E0E0E0; --text: #111; --sub: #666; --muted: #999;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 0 0 80px; }
  header { background: var(--green); color: #fff; padding: 16px 20px 14px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  header .icon { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header p  { font-size: 12px; opacity: 0.8; margin-top: 1px; }
  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 66px; z-index: 99; }
  .tab { flex: 1; padding: 12px 0; font-size: 13px; font-weight: 500; color: var(--sub); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }
  .panel { display: none; padding: 16px; }
  .panel.active { display: block; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); }
  .card-title { font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
  .line-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .line-btn { padding: 20px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; text-align: center; transition: all 0.15s; }
  .line-btn .name { font-size: 22px; font-weight: 700; color: var(--text); }
  .line-btn .sub  { font-size: 11px; color: var(--sub); margin-top: 3px; }
  .line-btn.selected { border-color: var(--green); background: var(--green-light); }
  .line-btn.selected .name { color: var(--green-dark); }
  .line-btn.selected .sub  { color: var(--green); }
  .field { margin-bottom: 12px; }
  .field label { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); margin-bottom: 5px; }
  .field label span { font-size: 11px; color: var(--muted); }
  .field input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 16px; color: var(--text); background: var(--surface); outline: none; }
  .field input:focus { border-color: var(--green); }
  .ratio-row { display: flex; align-items: flex-start; gap: 8px; padding: 10px; border-radius: var(--radius-sm); background: var(--bg); margin-bottom: 8px; }
  .ratio-info { flex: 1; min-width: 0; }
  .ratio-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .ratio-name { font-size: 13px; font-weight: 600; }
  .ratio-sub  { font-size: 11px; color: var(--sub); }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .badge-ok   { background: var(--ok-bg);   color: var(--ok-fg); }
  .badge-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .badge-bad  { background: var(--bad-bg);  color: var(--bad-fg); }
  .badge-opt  { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .bar { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; margin-top: 5px; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .total-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); margin-top: 10px; }
  .total-row span:first-child { font-size: 13px; color: var(--sub); }
  .total-row span:last-child  { font-size: 20px; font-weight: 600; }
  .btn-primary { width: 100%; padding: 15px; background: var(--green); color: #fff; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-primary:active:not(:disabled) { opacity: 0.85; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .metric { background: var(--surface); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); }
  .metric-label { font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
  .metric-value { font-size: 22px; font-weight: 600; color: var(--text); }
  .metric-unit  { font-size: 12px; font-weight: 400; color: var(--sub); }
  .log-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .log-item:last-child { border-bottom: none; }
  .log-time { font-size: 12px; color: var(--sub); margin-bottom: 2px; }
  .log-vals { font-size: 12px; color: var(--text); }
  .log-kg   { font-size: 14px; font-weight: 600; color: var(--green); margin-left: 10px; white-space: nowrap; }
  .empty { text-align: center; padding: 32px 16px; color: var(--sub); font-size: 14px; line-height: 1.7; }
  .line-filter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .line-filter-btn { padding: 10px 4px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; font-size: 15px; font-weight: 700; color: var(--sub); }
  .line-filter-btn.active { border-color: var(--green); color: var(--green); background: var(--green-light); }
  .lb { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; margin-right: 4px; }
  .lb-S1 { background: #E6F1FB; color: #0C447C; }
  .lb-S2 { background: #EEEDFE; color: #3C3489; }
  .lb-B1 { background: #FAEEDA; color: #633806; }
  .lb-B2 { background: #FAECE7; color: #712B13; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 11px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 999; white-space: nowrap; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  .toast.ok  { background: var(--green); }
  .toast.err { background: var(--bad-fg); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="icon">⚗️</div>
    <div>
      <h1>DU Rebar — Chemical Log</h1>
      <p>5.66 kg/cycle · 40 min/cycle</p>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('log')">Log Cycle</button>
    <button class="tab" onclick="switchTab('today')">My Line Today</button>
    <button class="tab" onclick="switchTab('all')">All Lines</button>
  </div>

  <!-- LOG -->
  <div id="panel-log" class="panel active">
    <div class="card">
      <div class="card-title">Select Your Line</div>
      <div class="line-grid">
        <button class="line-btn" onclick="selectLine(this,'S1')"><div class="name">S1</div><div class="sub">Straight line 1</div></button>
        <button class="line-btn" onclick="selectLine(this,'S2')"><div class="name">S2</div><div class="sub">Straight line 2</div></button>
        <button class="line-btn" onclick="selectLine(this,'B1')"><div class="name">B1</div><div class="sub">Bend line 1</div></button>
        <button class="line-btn" onclick="selectLine(this,'B2')"><div class="name">B2</div><div class="sub">Bend line 2</div></button>
      </div>
    </div>

    <div class="card" id="entry-card" style="display:none;">
      <div class="card-title" id="entry-title">Cycle Amounts</div>
      <div class="field">
        <label>Chem 01 <span>Target: 3.000 kg</span></label>
        <input type="number" id="c1" step="0.001" placeholder="3.000" inputmode="decimal" oninput="updateRatios()">
      </div>
      <div class="field">
        <label>Chem 02 <span>Target: 2.400 kg</span></label>
        <input type="number" id="c2" step="0.001" placeholder="2.400" inputmode="decimal" oninput="updateRatios()">
      </div>
      <div class="field">
        <label>Chem 03 <span>Target: 0.119 kg</span></label>
        <input type="number" id="c3" step="0.001" placeholder="0.119" inputmode="decimal" oninput="updateRatios()">
      </div>
      <div class="field">
        <label>Chem 04 <span style="color:var(--green);">Optional · 0.141 kg</span></label>
        <input type="number" id="c4" step="0.001" placeholder="Leave blank if not used" inputmode="decimal" oninput="updateRatios()">
      </div>
    </div>

    <div class="card" id="ratio-card" style="display:none;">
      <div class="card-title">Ratio Check</div>
      <div id="ratio-content"></div>
      <div class="total-row">
        <span>Batch total</span>
        <span id="batch-total">—</span>
      </div>
    </div>

    <button class="btn-primary" id="submit-btn" onclick="submitBatch()" disabled>Select a line first</button>
  </div>

  <!-- TODAY -->
  <div id="panel-today" class="panel">
    <div class="card" style="padding:12px 16px;">
      <div class="card-title" style="margin-bottom:10px;">Filter by line</div>
      <div class="line-filter">
        <button class="line-filter-btn" id="ft-S1" onclick="setFilter('S1')">S1</button>
        <button class="line-filter-btn" id="ft-S2" onclick="setFilter('S2')">S2</button>
        <button class="line-filter-btn" id="ft-B1" onclick="setFilter('B1')">B1</button>
        <button class="line-filter-btn" id="ft-B2" onclick="setFilter('B2')">B2</button>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">Cycles</div><div class="metric-value" id="td-c">—</div></div>
      <div class="metric"><div class="metric-label">Total</div><div class="metric-value" id="td-t">— <span class="metric-unit">kg</span></div></div>
      <div class="metric"><div class="metric-label">Avg/cycle</div><div class="metric-value" id="td-a">—</div></div>
      <div class="metric"><div class="metric-label">Alerts</div><div class="metric-value" id="td-al" style="color:var(--sub);">—</div></div>
    </div>
    <div class="card">
      <div class="card-title" id="today-title">Select a line above</div>
      <div id="today-log"><div class="empty">Select a line to view today's cycles</div></div>
    </div>
  </div>

  <!-- ALL LINES -->
  <div id="panel-all" class="panel">
    <div class="metrics">
      <div class="metric"><div class="metric-label">Total cycles</div><div class="metric-value" id="all-c">—</div></div>
      <div class="metric"><div class="metric-label">Total chem</div><div class="metric-value" id="all-t">— <span class="metric-unit">kg</span></div></div>
    </div>
    <div id="line-cards">
      <div class="empty">Loading data…</div>
    </div>
    <button class="btn-primary" style="margin-top:0;" onclick="loadAll()">Refresh</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdEhUOohMN2-R04Q2odx0RImKesXJo11NdfRrsF-7a7UZjhWhUkRkDLS8GSCva433Qyw/exec';
const TARGETS = { c1:3.000, c2:2.400, c3:0.119, c4:0.141 };
const LINES = ['S1','S2','B1','B2'];
let activeLine = null, activeFilter = null;
let cache = [];
try { cache = JSON.parse(localStorage.getItem('du_logs') || '[]'); } catch(e) {}

function istNow() { return new Date(new Date().getTime() + 5.5*60*60*1000); }
function istString() { const d=istNow(); return d.toISOString().slice(0,19).replace('T',' ')+' IST'; }
function today() { return istNow().toISOString().slice(0,10); }

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show ' + (type||'ok');
  setTimeout(() => el.className = 'toast', 2800);
}

function dev(v,t) { return Math.abs((v-t)/t*100); }
function badge(d) {
  if (d<=5)  return ['badge-ok','OK'];
  if (d<=10) return ['badge-warn','High'];
  return ['badge-bad','Alert'];
}

function selectLine(el, line) {
  activeLine = line;
  document.querySelectorAll('.line-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('entry-card').style.display = 'block';
  document.getElementById('entry-title').textContent = 'Cycle Amounts — Line ' + line;
  updateSubmitBtn();
}

function updateSubmitBtn() {
  const c1 = parseFloat(document.getElementById('c1').value);
  const btn = document.getElementById('submit-btn');
  if (!activeLine) { btn.disabled = true; btn.textContent = 'Select a line first'; return; }
  if (isNaN(c1) || c1 <= 0) { btn.disabled = true; btn.textContent = 'Enter amounts above'; return; }
  btn.disabled = false; btn.textContent = 'Record Cycle on ' + activeLine;
}

function updateRatios() {
  updateSubmitBtn();
  const c1 = parseFloat(document.getElementById('c1').value);
  const c2 = parseFloat(document.getElementById('c2').value);
  const c3 = parseFloat(document.getElementById('c3').value);
  const c4v = document.getElementById('c4').value;
  const c4 = c4v !== '' ? parseFloat(c4v) : null;
  const card = document.getElementById('ratio-card');
  if ([c1,c2,c3].some(v => isNaN(v)||v<=0)) { card.style.display='none'; return; }
  card.style.display='block';
  const vals = {c1,c2,c3}; if (c4!==null&&!isNaN(c4)&&c4>0) vals.c4=c4;
  const total = Object.values(vals).reduce((s,v)=>s+v,0);
  document.getElementById('batch-total').textContent = total.toFixed(3)+' kg';
  const names = {c1:'Chem 01',c2:'Chem 02',c3:'Chem 03',c4:'Chem 04'};
  let html = '';
  Object.keys(vals).forEach(k => {
    const d = dev(vals[k],TARGETS[k]);
    const [cls,lbl] = badge(d);
    const pct = Math.min(d/10*100,100);
    const col = cls==='badge-ok'?'#1D9E75':cls==='badge-warn'?'#EF9F27':'#E24B4A';
    html += `<div class="ratio-row"><div class="ratio-info">
      <div class="ratio-top"><span class="ratio-name">${names[k]}</span><span class="badge ${cls}">${lbl}</span></div>
      <div class="ratio-sub">Got ${vals[k].toFixed(3)} · Target ${TARGETS[k].toFixed(3)} · ${d.toFixed(1)}% off</div>
      <div class="bar"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${col};"></div></div>
    </div></div>`;
  });
  if (!vals.c4) html += `<div class="ratio-row"><div class="ratio-info"><div class="ratio-top"><span class="ratio-name">Chem 04</span><span class="badge badge-opt">Not used</span></div></div></div>`;
  document.getElementById('ratio-content').innerHTML = html;
}

function submitBatch() {
  if (!activeLine) { toast('Select a line first','err'); return; }
  const c1=parseFloat(document.getElementById('c1').value);
  const c2=parseFloat(document.getElementById('c2').value);
  const c3=parseFloat(document.getElementById('c3').value);
  const c4v=document.getElementById('c4').value;
  const c4=c4v!==''?parseFloat(c4v):null;
  if ([c1,c2,c3].some(v=>isNaN(v)||v<=0)) { toast('Fill in Chem 01, 02 and 03','err'); return; }
  const vals={c1,c2,c3}; if(c4!==null&&!isNaN(c4)&&c4>0) vals.c4=c4;
  const total=+Object.values(vals).reduce((s,v)=>s+v,0).toFixed(4);
  const alerts=Object.keys(vals).filter(k=>dev(vals[k],TARGETS[k])>5).length;
  const entry={timestamp:istString(),line:activeLine,c1,c2,c3,c4:vals.c4||null,total,alerts};
  cache.push({...entry,date:today()});
  try{localStorage.setItem('du_logs',JSON.stringify(cache));}catch(e){}
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='Saving…';
  fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(entry)})
    .then(r=>r.json()).then(()=>{
      toast('Saved to Google Sheet ✓','ok');
      reset();
    }).catch(()=>{
      toast('Saved locally — will sync when online');
      reset();
    });
  function reset() {
    ['c1','c2','c3','c4'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ratio-card').style.display='none';
    btn.disabled=false; btn.textContent='Record Cycle on '+activeLine;
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['log','today','all'][i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if (name==='all') loadAll();
}

function setFilter(line) {
  activeFilter=line;
  document.querySelectorAll('.line-filter-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ft-'+line).classList.add('active');
  document.getElementById('today-title').textContent='Line '+line+' — Today';
  fetch(SCRIPT_URL).then(r=>r.json()).then(d=>renderToday(d.data||[],line)).catch(()=>renderToday(cache,line));
}

function renderToday(data,line) {
  const td=today();
  const rows=data.filter(r=>r.line===line&&(r.date===td||(r.timestamp||'').slice(0,10)===td));
  document.getElementById('td-c').textContent=rows.length;
  const tot=rows.reduce((s,r)=>s+parseFloat(r.total||0),0);
  document.getElementById('td-t').innerHTML=tot.toFixed(2)+' <span class="metric-unit">kg</span>';
  document.getElementById('td-a').innerHTML=rows.length?(tot/rows.length).toFixed(3)+' <span class="metric-unit">kg</span>':'—';
  const al=rows.reduce((s,r)=>s+parseInt(r.alerts||0),0);
  const alEl=document.getElementById('td-al');
  alEl.textContent=al; alEl.style.color=al>0?'#A32D2D':'var(--text)';
  if(!rows.length){document.getElementById('today-log').innerHTML=`<div class="empty">No cycles logged on ${line} today</div>`;return;}
  let html='';
  [...rows].reverse().forEach(r=>{
    const time = (r.timestamp||'').slice(11,16) || '—';
    const c4str=r.c4?` · C4:${parseFloat(r.c4).toFixed(3)}`:'';
    const al=parseInt(r.alerts||0);
    html+=`<div class="log-item">
      <div>
        <div class="log-time">${time} <span class="lb lb-${r.line}">${r.line}</span></div>
        <div class="log-vals">C1:${parseFloat(r.c1).toFixed(3)} · C2:${parseFloat(r.c2).toFixed(3)} · C3:${parseFloat(r.c3).toFixed(3)}${c4str}</div>
        ${al>0?`<span class="badge badge-warn" style="margin-top:4px;display:inline-block;font-size:10px;">${al} alert${al>1?'s':''}</span>`:''}
      </div>
      <div class="log-kg">${parseFloat(r.total).toFixed(3)}<br><span style="font-size:10px;font-weight:400;color:var(--sub);">kg</span></div>
    </div>`;
  });
  document.getElementById('today-log').innerHTML=html;
}

function loadAll() {
  document.getElementById('line-cards').innerHTML='<div class="empty">Loading…</div>';
  fetch(SCRIPT_URL).then(r=>r.json()).then(d=>renderAll(d.data||[])).catch(()=>renderAll(cache));
}

function renderAll(data) {
  const td=today();
  const todayData=data.filter(r=>(r.date===td||(r.timestamp||'').slice(0,10)===td));
  document.getElementById('all-c').textContent=todayData.length;
  const tot=todayData.reduce((s,r)=>s+parseFloat(r.total||0),0);
  document.getElementById('all-t').innerHTML=tot.toFixed(2)+' <span class="metric-unit">kg</span>';
  let html='';
  LINES.forEach(line=>{
    const rows=todayData.filter(r=>r.line===line);
    const lt=rows.reduce((s,r)=>s+parseFloat(r.total||0),0);
    const al=rows.reduce((s,r)=>s+parseInt(r.alerts||0),0);
    html+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span class="lb lb-${line}" style="font-size:15px;font-weight:700;padding:4px 12px;">${line}</span>
        ${al>0?`<span class="badge badge-warn">${al} alert${al>1?'s':''}</span>`:'<span class="badge badge-ok">All OK</span>'}
      </div>
      <div style="display:flex;gap:16px;">
        <div><div style="font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.04em;">Cycles</div><div style="font-size:20px;font-weight:600;">${rows.length}</div></div>
        <div><div style="font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.04em;">Total</div><div style="font-size:20px;font-weight:600;">${lt.toFixed(2)}<span style="font-size:12px;font-weight:400;color:var(--sub);"> kg</span></div></div>
        <div><div style="font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.04em;">Avg</div><div style="font-size:20px;font-weight:600;">${rows.length?(lt/rows.length).toFixed(2):'—'}<span style="font-size:12px;font-weight:400;color:var(--sub);"> kg</span></div></div>
      </div>
    </div>`;
  });
  document.getElementById('line-cards').innerHTML=html||'<div class="empty">No data logged today yet</div>';
}
</script>
</body>
</html>
